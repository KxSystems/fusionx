context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-openblas
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0

requirements:
  host:
    - q-kx-fusionx
    - openblas
  run:
    - q-kx-fusionx
    - openblas

about:
  homepage: https://github.com/KxSystems/fusionx
  repository: https://github.com/KxSystems/fusionx
  license: Apache-2.0
  license_file: LICENSE
  summary: q bindings to BLAS (Basic Linear Algebra Subprograms) libraries, using OpenBLAS.
  description: |
    The BLAS module provides q bindings to BLAS libraries, enabling high-performance linear algebra
    operations directly from q. This package is part of the fusionx module and uses the OpenBLAS library.
