context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-expat
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0

requirements:
  host:
    - q-kx-fusionx
    - libexpat
  run:
    - q-kx-fusionx
    - libexpat

about:
  homepage: https://github.com/KxSystems/fusionx
  repository: https://github.com/KxSystems/fusionx
  license: Apache-2.0
  license_file: LICENSE
  summary: q bindings to the Expat XML parsing library.
  description: |
    The Expat module provides q bindings to the Expat XML parsing library, enabling XML parsing
    directly from q. This package is part of the fusionx module.
