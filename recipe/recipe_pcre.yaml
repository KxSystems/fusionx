context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-pcre2
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0

requirements:
  host:
    - q-kx-fusionx
    - pcre2
  run:
    - q-kx-fusionx
    - pcre2

about:
  homepage: https://github.com/KxSystems/fusionx
  repository: https://github.com/KxSystems/fusionx
  license: Apache-2.0
  license_file: LICENSE
  summary: q bindings to the PCRE2 regular expression library.
  description: |
    The PCRE2 module provides q bindings to the PCRE2 regular expression library, enabling Perl-compatible
    regular expression matching directly from q. This package is part of the fusionx module.
